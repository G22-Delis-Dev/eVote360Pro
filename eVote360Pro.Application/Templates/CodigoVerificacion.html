<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Código de Verificación</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f4f7f6; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <tr>
                        <td align="center" style="background-color: #004a99; padding: 30px;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px;">eVote360 Pro</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px; color: #333333;">
                            <h2 style="margin-top: 0;">¡Hola, {{Nombre}}!</h2>
                            <p style="font-size: 16px; line-height: 1.5;">Has solicitado verificar tu identidad. Para continuar con el proceso, utiliza el siguiente código:</p>
                            <div style="background-color: #eef2f7; border: 2px dashed #004a99; padding: 20px; text-align: center; margin: 30px 0; border-radius: 5px;">
                                <span style="font-size: 32px; font-weight: bold; color: #004a99; letter-spacing: 8px;">{{Codigo}}</span>
                            </div>
                            <p style="font-size: 14px; color: #777;">Este código expirará en <strong>5 minutos</strong>. Si no solicitaste este código, por favor ignora este correo.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px; background-color: #eeeeee; font-size: 12px; color: #888888;">
                            &copy; 2026 eVote360 Pro - Sistema de Votación Electrónica
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
